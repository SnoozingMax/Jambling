<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#f7f4ec; --card:#fffdf8; --ink:#17140f; --muted:#7c7466; --line:#e4ddcd;
  --accent:#e2482d; --win:#1d8a4b; --lose:#d0342c; --gold:#e8b23a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:28px;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:7px 14px 7px 8px;border-radius:999px;font-family:"IBM Plex Mono";font-weight:600}
.bal i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe59a,var(--gold) 60%,#b9821d);display:inline-block}
.who{color:var(--muted);font-size:14px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.ghost:hover{border-color:var(--ink)}

/* tabs */
nav{display:flex;gap:22px;margin:18px 0 22px}
nav button{background:none;border:0;padding:4px 0;cursor:pointer;font-family:Fraunces;font-weight:600;font-size:20px;color:var(--muted);border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-color:var(--accent)}

/* panels */
.game{display:grid;grid-template-columns:280px 1fr;gap:18px}
@media (max-width:720px){.game{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:16px}
input[type=number],input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus{border-color:var(--ink)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;padding:6px 0;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:"IBM Plex Mono";font-size:13px}
.chips button:hover{border-color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-weight:600}
.pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:transform .08s}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.5;cursor:not-allowed}
.go.cash{background:var(--win)}

/* coin */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;gap:22px}
.coinwrap{perspective:900px}
.coin{width:170px;height:170px;position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.15,.8,.25,1)}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;font-family:Fraunces;font-weight:800;font-size:64px;color:#7a5410;
  background:radial-gradient(circle at 35% 30%,#fff1bf,var(--gold) 55%,#b9821d);box-shadow:inset 0 0 0 8px rgba(255,255,255,.35),inset 0 0 0 12px rgba(122,84,16,.25),0 14px 30px rgba(0,0,0,.12)}
.face.t{transform:rotateY(180deg)}
.result{font-family:Fraunces;font-size:24px;font-weight:600;min-height:34px}
.win{color:var(--win)} .lose{color:var(--lose)}

/* crash */
.graphbox{position:relative;height:340px}
canvas{width:100%;height:100%;display:block}
.mult{position:absolute;top:18px;left:0;right:0;text-align:center;font-family:"IBM Plex Mono";font-weight:600;font-size:46px;pointer-events:none}
.sub{position:absolute;top:76px;left:0;right:0;text-align:center;font-family:Fraunces;font-size:18px;pointer-events:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* board */
table{width:100%;border-collapse:collapse}
td{padding:12px 6px;border-bottom:1px dashed var(--line)}
td:first-child{width:40px;color:var(--muted);font-family:"IBM Plex Mono"}
td:last-child{text-align:right;font-family:"IBM Plex Mono";font-weight:600}
tr.me td{color:var(--accent)}

/* auth */
.auth{max-width:380px;margin:9vh auto 0}
.auth h1{font-family:Fraunces;font-weight:800;font-size:44px;margin:0 0 4px;letter-spacing:-1px}
.auth h1 span{color:var(--accent)}
.auth p{color:var(--muted);margin:0 0 22px}
.switch{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;margin-top:14px}
.msg{color:var(--lose);font-size:14px;min-height:20px;margin-top:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" class="wrap" hidden>
  <div class="auth">
    <h1>Lucky<span>.</span>Ledger</h1>
    <p id="authSub">Sign in to keep your coins.</p>
    <form id="authForm" class="card">
      <div class="field" id="userField" hidden>
        <label>Username</label>
        <input id="username" type="text" maxlength="20" autocomplete="username">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <button class="go" id="authBtn">Sign in</button>
      <div class="msg" id="authMsg"></div>
    </form>
    <button class="switch" id="authSwitch">New here? Create an account</button>
  </div>
</section>

<!-- APP -->
<section id="app" class="wrap" hidden>
  <header>
    <div class="logo">Lucky<span>.</span>Ledger</div>
    <div class="right">
      <span class="who" id="who"></span>
      <div class="bal"><i></i><span id="balance">0.00</span></div>
      <button class="ghost" id="refill" hidden>Refill</button>
      <button class="ghost" id="logout">Sign out</button>
    </div>
  </header>

  <nav>
    <button data-tab="coin" class="on">Coin Flip</button>
    <button data-tab="crash">Rocket</button>
    <button data-tab="board">Leaderboard</button>
  </nav>

  <!-- coin -->
  <div id="tab-coin" class="game">
    <div class="card">
      <div class="field">
        <label>Bet</label>
        <input id="coinBet" type="number" min="0.01" step="0.01" value="10">
        <div class="chips" data-for="coinBet">
          <button data-op="half">½</button><button data-op="double">2×</button><button data-op="max">Max</button>
        </div>
      </div>
      <div class="field">
        <label>Pick</label>
        <div class="pick" id="pick">
          <button data-pick="heads" class="on">Heads</button>
          <button data-pick="tails">Tails</button>
        </div>
      </div>
      <button class="go" id="flipBtn">Flip</button>
      <div class="hint">Win doubles your bet.</div>
    </div>
    <div class="card stage">
      <div class="coinwrap">
        <div class="coin" id="coin">
          <div class="face h">H</div>
          <div class="face t">T</div>
        </div>
      </div>
      <div class="result" id="coinResult"></div>
    </div>
  </div>

  <!-- crash -->
  <div id="tab-crash" class="game" hidden>
    <div class="card">
      <div class="field">
        <label>Bet</label>
        <input id="crashBet" type="number" min="0.01" step="0.01" value="10">
        <div class="chips" data-for="crashBet">
          <button data-op="half">½</button><button data-op="double">2×</button><button data-op="max">Max</button>
        </div>
      </div>
      <div class="field">
        <label>Auto cash out (optional)</label>
        <input id="autoCash" type="number" min="1.01" step="0.01" placeholder="e.g. 2.00">
      </div>
      <button class="go" id="crashBtn">Launch</button>
      <div class="hint">Cash out before it crashes. Too late and you lose the bet.</div>
    </div>
    <div class="card" style="padding:10px">
      <div class="graphbox">
        <canvas id="graph"></canvas>
        <div class="mult" id="mult">1.00×</div>
        <div class="sub" id="crashMsg"></div>
      </div>
    </div>
  </div>

  <!-- leaderboard -->
  <div id="tab-board" hidden>
    <div class="card">
      <table><tbody id="board"></tbody></table>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG: paste from Supabase > Project Settings > API ======
const SUPABASE_URL = 'https://khfkpupiszvrgxkmuqsl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoZmtwdXBpc3p2cmd4a211cXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTk1ODksImV4cCI6MjEwNjQ3NTU4OX0.NZfop-_H5arJrj-vyRuGhSbSaVKZNvQOch8_0cT7s_I';
// ==================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const K = 0.09; // growth rate, must match setup.sql
const $ = id => document.getElementById(id);
let user = null, balance = 0;

const fmt = n => Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
function setBalance(b){ balance = Number(b); $('balance').textContent = fmt(balance); $('refill').hidden = balance >= 10; }
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function readBet(id){
  const v = Math.round(parseFloat($(id).value) * 100) / 100;
  if (!(v > 0)) { toast('Enter a bet'); return 0; }
  if (v > balance) { toast('Not enough coins'); return 0; }
  return v;
}

/* ---------- auth ---------- */
let mode = 'in';
function renderAuth(){
  const up = mode === 'up';
  $('userField').hidden = !up;
  $('authBtn').textContent = up ? 'Create account' : 'Sign in';
  $('authSub').textContent = up ? 'Start with 1,000 coins.' : 'Sign in to keep your coins.';
  $('authSwitch').textContent = up ? 'Have an account? Sign in' : 'New here? Create an account';
  $('authMsg').textContent = '';
}
$('authSwitch').onclick = () => { mode = mode === 'in' ? 'up' : 'in'; renderAuth(); };
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('password').value;
  $('authBtn').disabled = true; $('authMsg').textContent = '';
  let res;
  if (mode === 'up') {
    res = await sb.auth.signUp({ email, password, options: { data: { username: $('username').value.trim() } } });
    if (!res.error && !res.data.session) $('authMsg').textContent = 'Check your email to confirm, then sign in.';
  } else {
    res = await sb.auth.signInWithPassword({ email, password });
  }
  if (res.error) $('authMsg').textContent = res.error.message;
  $('authBtn').disabled = false;
};
$('logout').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_event, session) => {
  user = session?.user || null;
  $('auth').hidden = !!user;
  $('app').hidden = !user;
  if (user) loadProfile();
});

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('username,balance').eq('id', user.id).single();
  if (error) return toast(error.message);
  $('who').textContent = data.username;
  setBalance(data.balance);
  drawGraph(1);
}

$('refill').onclick = async () => {
  const { data, error } = await sb.rpc('claim_refill');
  if (error) return toast(error.message);
  setBalance(data.balance); toast('Refilled to 1,000');
};

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['coin', 'crash', 'board'].forEach(t => $('tab-' + t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === 'board') loadBoard();
  if (b.dataset.tab === 'crash' && !round) drawGraph(1);
});

/* ---------- bet chips ---------- */
document.querySelectorAll('.chips').forEach(c => c.onclick = e => {
  const op = e.target.dataset.op; if (!op) return;
  const inp = $(c.dataset.for); let v = parseFloat(inp.value) || 0;
  if (op === 'half') v = v / 2;
  if (op === 'double') v = v * 2;
  if (op === 'max') v = balance;
  inp.value = (Math.floor(Math.min(v, balance) * 100) / 100).toFixed(2);
});

/* ---------- coin flip ---------- */
let pick = 'heads', coinRot = 0, flipping = false;
$('pick').onclick = e => {
  const p = e.target.dataset.pick; if (!p) return;
  pick = p;
  $('pick').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.pick === p));
};
$('flipBtn').onclick = async () => {
  if (flipping) return;
  const bet = readBet('coinBet'); if (!bet) return;
  flipping = true; $('flipBtn').disabled = true;
  $('coinResult').textContent = ''; $('coinResult').className = 'result';
  const { data, error } = await sb.rpc('flip_coin', { p_bet: bet, p_pick: pick });
  if (error) { toast(error.message); flipping = false; $('flipBtn').disabled = false; return; }
  const target = data.result === 'heads' ? 0 : 180;
  coinRot += 1800 + ((target - (coinRot % 360)) + 360) % 360;
  $('coin').style.transform = `rotateY(${coinRot}deg)`;
  setTimeout(() => {
    setBalance(data.balance);
    const r = $('coinResult');
    r.textContent = data.won ? `${data.result}! +${fmt(bet)}` : `${data.result}. −${fmt(bet)}`;
    r.className = 'result ' + (data.won ? 'win' : 'lose');
    flipping = false; $('flipBtn').disabled = false;
  }, 1550);
};

/* ---------- crash ---------- */
let round = null, raf = null, poll = null;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function niceStep(range){
  const raw = range / 4, p = 10 ** Math.floor(Math.log10(raw)), n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}

function drawGraph(m, state){ // state: undefined | 'lost' | 'won'
  const c = $('graph'), ctx = c.getContext('2d');
  const w = c.clientWidth, h = c.clientHeight, d = window.devicePixelRatio || 1;
  if (!w) return;
  if (c.width !== w * d || c.height !== h * d) { c.width = w * d; c.height = h * d; }
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);

  const t = Math.log(m) / K;
  const maxT = Math.max(8, t * 1.15), maxM = Math.max(2, m * 1.15);
  const pad = { l: 48, r: 16, t: 120, b: 26 };
  const X = s => pad.l + (s / maxT) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - ((v - 1) / (maxM - 1)) * (h - pad.t - pad.b);

  // grid
  ctx.font = '11px "IBM Plex Mono"'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#ece6d8'; ctx.fillStyle = '#9a9283'; ctx.lineWidth = 1;
  const step = niceStep(maxM - 1);
  for (let v = 1; v <= maxM + 1e-9; v += step) {
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(step < 1 ? 1 : 0) + '×', 6, y);
  }
  ctx.textBaseline = 'top';
  const ts = niceStep(maxT);
  for (let s = 0; s <= maxT; s += ts) ctx.fillText(Math.round(s) + 's', X(s) - 6, h - pad.b + 8);

  if (m <= 1) return;
  const color = state === 'lost' ? css('--lose') : state === 'won' ? css('--win') : css('--ink');

  const path = () => {
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const s = t * i / 80, x = X(s), y = Y(Math.exp(K * s));
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
  };
  // fill
  path(); ctx.lineTo(X(t), Y(1)); ctx.lineTo(X(0), Y(1)); ctx.closePath();
  ctx.fillStyle = state === 'lost' ? 'rgba(208,52,44,.08)' : state === 'won' ? 'rgba(29,138,75,.08)' : 'rgba(226,72,45,.08)';
  ctx.fill();
  // line
  path(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  // tip
  ctx.beginPath(); ctx.arc(X(t), Y(m), 6, 0, Math.PI * 2);
  ctx.fillStyle = state ? color : css('--accent'); ctx.fill();
}

function setCrashBtn(live){
  const b = $('crashBtn');
  b.classList.toggle('cash', live);
  b.textContent = live ? 'Cash out' : 'Launch';
  b.disabled = false;
}

$('crashBtn').onclick = () => round ? cashOut() : startCrash();

async function startCrash(){
  const bet = readBet('crashBet'); if (!bet) return;
  $('crashBtn').disabled = true;
  $('crashMsg').textContent = ''; $('crashMsg').className = 'sub';
  $('mult').className = 'mult';
  const { data, error } = await sb.rpc('crash_start', { p_bet: bet });
  if (error) { toast(error.message); $('crashBtn').disabled = false; return; }
  setBalance(data.balance);
  round = { id: data.round_id, bet, t0: performance.now(), done: false, cashing: false };
  setCrashBtn(true);
  raf = requestAnimationFrame(tick);
  poll = setInterval(checkCrash, 250);
}

function tick(){
  if (!round || round.done) return;
  const m = Math.exp(K * (performance.now() - round.t0) / 1000);
  drawGraph(m);
  $('mult').textContent = m.toFixed(2) + '×';
  $('crashBtn').textContent = 'Cash out ' + fmt(round.bet * m);
  const auto = parseFloat($('autoCash').value);
  if (auto > 1 && m >= auto) cashOut();
  raf = requestAnimationFrame(tick);
}

async function checkCrash(){
  if (!round || round.done || round.cashing) return;
  const id = round.id;
  const { data } = await sb.rpc('crash_status', { p_round: id });
  if (data?.crashed && round && round.id === id && !round.done) endRound(false, data.crash_point);
}

async function cashOut(){
  if (!round || round.done || round.cashing) return;
  round.cashing = true; $('crashBtn').disabled = true;
  const id = round.id;
  const { data, error } = await sb.rpc('crash_cashout', { p_round: id });
  if (!round || round.id !== id || round.done) return;
  if (error) { // probably already crashed; let status check finish it
    round.cashing = false; checkCrash(); return;
  }
  setBalance(data.balance);
  data.won ? endRound(true, data.multiplier, data.payout) : endRound(false, data.crash_point);
}

function endRound(won, m, payout){
  round.done = true;
  cancelAnimationFrame(raf); clearInterval(poll);
  m = Number(m);
  drawGraph(m, won ? 'won' : 'lost');
  $('mult').textContent = m.toFixed(2) + '×';
  $('mult').className = 'mult ' + (won ? 'win' : 'lose');
  $('crashMsg').textContent = won ? `Cashed out +${fmt(payout)}` : `Crashed. −${fmt(round.bet)}`;
  $('crashMsg').className = 'sub ' + (won ? 'win' : 'lose');
  round = null;
  setCrashBtn(false);
}

window.addEventListener('resize', () => { if (!round) drawGraph(1); });

/* ---------- leaderboard ---------- */
async function loadBoard(){
  const { data, error } = await sb.from('profiles').select('id,username,balance').order('balance', { ascending: false }).limit(10);
  if (error) return toast(error.message);
  $('board').innerHTML = '';
  data.forEach((p, i) => {
    const tr = document.createElement('tr');
    if (p.id === user.id) tr.className = 'me';
    tr.innerHTML = `<td>${i + 1}</td><td></td><td>${fmt(p.balance)}</td>`;
    tr.children[1].textContent = p.username; // safe from HTML injection
    $('board').appendChild(tr);
  });
}

renderAuth();
</script>
</body>
</html>
