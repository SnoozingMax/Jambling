<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jambling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#0f0f12; --card:#18181d; --ink:#f2efe8; --muted:#8d8a94; --line:#2a2a31; --field:#111115; --grid:#24242a; --gridtext:#6c6974;
  --accent:#ff5a3c; --win:#2fbf6b; --lose:#ff4d45; --gold:#e8b23a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:28px;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal{display:flex;align-items:center;gap:8px;background:var(--line);color:var(--ink);padding:7px 14px 7px 8px;border-radius:999px;font-family:"IBM Plex Mono";font-weight:600}
.bal i{width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid #c8952a;display:inline-block}
.daily{border-color:var(--gold);color:var(--gold)}
.daily:disabled{border-color:var(--line);color:var(--muted);cursor:default}
.who{color:var(--muted);font-size:14px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.ghost:hover{border-color:var(--ink)}

/* tabs */
nav{display:flex;gap:22px;margin:18px 0 22px}
nav button{background:none;border:0;padding:4px 0;cursor:pointer;font-family:Fraunces;font-weight:600;font-size:20px;color:var(--muted);border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-color:var(--accent)}

/* panels */
.game{display:grid;grid-template-columns:280px 1fr;gap:18px}
@media (max-width:720px){.game{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:16px}
input[type=number],input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);outline:none}
input:focus{border-color:var(--ink)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;padding:6px 0;border:1px solid var(--line);background:var(--field);border-radius:8px;cursor:pointer;font-family:"IBM Plex Mono";font-size:13px}
.chips button:hover{border-color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{padding:10px;border:1px solid var(--line);background:var(--field);border-radius:10px;cursor:pointer;font-weight:600}
.pick button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:transform .08s}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.5;cursor:not-allowed}
.go.cash{background:var(--win)}

/* coin */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;gap:22px}
.coinwrap{perspective:900px}
.coin{width:170px;height:170px;position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.15,.8,.25,1)}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;font-family:Inter,sans-serif;font-weight:600;font-size:56px;color:#5c400c;background:var(--gold);border:6px solid #c8952a}
.face.t{transform:rotateY(180deg)}
.result{font-family:Fraunces;font-size:24px;font-weight:600;min-height:34px}
.win{color:var(--win)} .lose{color:var(--lose)}

/* crash */
.graphbox{position:relative;height:340px}
canvas{width:100%;height:100%;display:block}
.mult{position:absolute;top:18px;left:0;right:0;text-align:center;font-family:"IBM Plex Mono";font-weight:600;font-size:46px;pointer-events:none}
.sub{position:absolute;top:76px;left:0;right:0;text-align:center;font-family:Fraunces;font-size:18px;pointer-events:none}
.toggle{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0 0 16px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle span{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:.15s;flex:none}
.toggle span::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.15s}
.toggle input:checked + span{background:var(--win)}
.toggle input:checked + span::after{left:19px;background:#fff}
.holdbtn{width:100%;height:120px;border:2px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);font-weight:600;font-size:24px;letter-spacing:.1em;cursor:pointer}
.holdbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.holdbtn,.holdzone{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* board */
table{width:100%;border-collapse:collapse}
td{padding:12px 6px;border-bottom:1px dashed var(--line)}
td:first-child{width:40px;color:var(--muted);font-family:"IBM Plex Mono"}
td:last-child{text-align:right;font-family:"IBM Plex Mono";font-weight:600}
tr.me td{color:var(--accent)}

/* auth */
.auth{max-width:380px;margin:9vh auto 0}
.auth h1{font-family:Fraunces;font-weight:800;font-size:44px;margin:0 0 4px;letter-spacing:-1px}
.auth h1 span{color:var(--accent)}
.auth p{color:var(--muted);margin:0 0 22px}
.switch{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;margin-top:14px}
.msg{color:var(--lose);font-size:14px;min-height:20px;margin-top:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" class="wrap" hidden>
  <div class="auth">
    <h1>Jambling</h1>
    <p id="authSub">Sign in to keep your coins.</p>
    <form id="authForm" class="card">
      <div class="field">
        <label>Username</label>
        <input id="username" type="text" required maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Passcode (4-6 digits)</label>
        <input id="password" type="password" required inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="current-password">
      </div>
      <button class="go" id="authBtn">Sign in</button>
      <div class="msg" id="authMsg"></div>
    </form>
    <button class="switch" id="authSwitch">New here? Create an account</button>
  </div>
</section>

<!-- APP -->
<section id="app" class="wrap" hidden>
  <header>
    <div class="logo">Jambling</div>
    <div class="right">
      <span class="who" id="who"></span>
      <div class="bal"><i></i><span id="balance">0.00</span></div>
      <button class="ghost daily" id="daily" disabled>Daily</button>
      <button class="ghost" id="refill" hidden>Refill</button>
      <button class="ghost" id="logout">Sign out</button>
    </div>
  </header>

  <nav>
    <button data-tab="coin" class="on">Coin Flip</button>
    <button data-tab="crash">Rocket</button>
    <button data-tab="ride">Ride</button>
    <button data-tab="board">Leaderboard</button>
  </nav>

  <!-- coin -->
  <div id="tab-coin" class="game">
    <div class="card">
      <div class="field">
        <label>Bet</label>
        <input id="coinBet" type="number" min="0.01" step="0.01" value="10">
        <div class="chips" data-for="coinBet">
          <button data-op="half">½</button><button data-op="double">2×</button><button data-op="max">Max</button>
        </div>
      </div>
      <div class="field">
        <label>Pick</label>
        <div class="pick" id="pick">
          <button data-pick="heads" class="on">Heads</button>
          <button data-pick="tails">Tails</button>
        </div>
      </div>
      <button class="go" id="flipBtn">Flip</button>
      <div class="hint">Win doubles your bet.</div>
    </div>
    <div class="card stage">
      <div class="coinwrap">
        <div class="coin" id="coin">
          <div class="face h">H</div>
          <div class="face t">T</div>
        </div>
      </div>
      <div class="result" id="coinResult"></div>
    </div>
  </div>

  <!-- crash -->
  <div id="tab-crash" class="game" hidden>
    <div class="card">
      <div class="field">
        <label>Bet</label>
        <input id="crashBet" type="number" min="0.01" step="0.01" value="10">
        <div class="chips" data-for="crashBet">
          <button data-op="half">½</button><button data-op="double">2×</button><button data-op="max">Max</button>
        </div>
      </div>
      <div class="field">
        <label>Auto cash out (optional)</label>
        <input id="autoCash" type="number" min="1.01" step="0.01" placeholder="e.g. 2.00">
      </div>
      <label class="toggle"><input type="checkbox" id="ghostToggle" checked><span></span>Ghost after cash out</label>
      <button class="go" id="crashBtn">Launch</button>
      <div class="hint">Cash out before it crashes. Too late and you lose the bet.</div>
    </div>
    <div class="card" style="padding:10px">
      <div class="graphbox">
        <canvas id="graph"></canvas>
        <div class="mult" id="mult">1.00×</div>
        <div class="sub" id="crashMsg"></div>
      </div>
    </div>
  </div>

  <!-- ride -->
  <div id="tab-ride" class="game" hidden>
    <div class="card">
      <div class="field">
        <label>Bet</label>
        <input id="rideBet" type="number" min="0.01" step="0.01" value="10">
        <div class="chips" data-for="rideBet">
          <button data-op="half">½</button><button data-op="double">2×</button><button data-op="max">Max</button>
        </div>
      </div>
      <button class="go" id="rideStart">Start</button>
      <button class="holdbtn" id="holdBtn" hidden>HOLD</button>
      <button class="go cash" id="rideCash" hidden style="margin-top:10px">Stop</button>
      <div class="hint">Hold to ride: while you hold, your bet moves with the chart. Let go to lock it in. Press Stop to cash out.</div>
    </div>
    <div class="card" style="padding:10px">
      <div class="graphbox holdzone" id="rideBox">
        <canvas id="rideGraph"></canvas>
        <div class="mult" id="rideVal">0.00</div>
        <div class="sub" id="rideMsg"></div>
      </div>
    </div>
  </div>

  <!-- leaderboard -->
  <div id="tab-board" hidden>
    <div class="card">
      <table><tbody id="board"></tbody></table>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG: paste from Supabase > Project Settings > API ======
const SUPABASE_URL = 'https://khfkpupiszvrgxkmuqsl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoZmtwdXBpc3p2cmd4a211cXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTk1ODksImV4cCI6MjEwNjQ3NTU4OX0.NZfop-_H5arJrj-vyRuGhSbSaVKZNvQOch8_0cT7s_I';
// ==================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const K = 0.09; // growth rate, must match setup.sql
const $ = id => document.getElementById(id);
let user = null, balance = 0;

const fmt = n => Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
function setBalance(b){ balance = Number(b); $('balance').textContent = fmt(balance); $('refill').hidden = balance >= 10; }
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function readBet(id){
  const v = Math.round(parseFloat($(id).value) * 100) / 100;
  if (!(v > 0)) { toast('Enter a bet'); return 0; }
  if (v > balance) { toast('Not enough coins'); return 0; }
  return v;
}

/* ---------- auth ---------- */
let mode = 'in';
function renderAuth(){
  const up = mode === 'up';
  $('authBtn').textContent = up ? 'Create account' : 'Sign in';
  $('authSub').textContent = up ? 'Start with 1,000 coins.' : 'Sign in to keep your coins.';
  $('authSwitch').textContent = up ? 'Have an account? Sign in' : 'New here? Create an account';
  $('authMsg').textContent = '';
}
$('authSwitch').onclick = () => { mode = mode === 'in' ? 'up' : 'in'; renderAuth(); };
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('username').value.trim(), code = $('password').value;
  if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) { $('authMsg').textContent = 'Username: 3-20 letters, numbers, or _'; return; }
  if (!/^[0-9]{4,6}$/.test(code)) { $('authMsg').textContent = 'Passcode must be 4-6 digits'; return; }
  // Supabase needs an email + 6+ char password, so build them behind the scenes
  const email = name.toLowerCase() + '@users.jambling.app';
  const password = 'jmb-' + code;
  $('authBtn').disabled = true; $('authMsg').textContent = '';
  let res;
  if (mode === 'up') {
    res = await sb.auth.signUp({ email, password, options: { data: { username: name } } });
    if (res.error && /already/i.test(res.error.message)) res.error.message = 'That username is taken';
  } else {
    res = await sb.auth.signInWithPassword({ email, password });
    if (res.error && /invalid/i.test(res.error.message)) res.error.message = 'Wrong username or passcode';
  }
  if (res.error) $('authMsg').textContent = res.error.message;
  $('authBtn').disabled = false;
};
$('logout').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_event, session) => {
  user = session?.user || null;
  $('auth').hidden = !!user;
  $('app').hidden = !user;
  if (user) loadProfile();
});

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('username,balance').eq('id', user.id).single();
  if (error) return toast(error.message);
  $('who').textContent = data.username;
  setBalance(data.balance);
  const nd = await sb.rpc('daily_next');
  nextDaily = nd.data ? new Date(nd.data).getTime() : 0;
  updateDaily();
  drawGraph(1);
}

/* ---------- daily reward ---------- */
const DAILY_AMOUNT = 250; // resets at midnight Pacific
let nextDaily = 0;
function updateDaily(){
  const b = $('daily'), left = nextDaily - Date.now();
  if (left <= 0) { b.disabled = false; b.textContent = `Daily +${DAILY_AMOUNT}`; return; }
  b.disabled = true;
  const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000);
  b.textContent = `Daily in ${h}h ${m}m`;
}
setInterval(() => { if (user) updateDaily(); }, 30000);
$('daily').onclick = async () => {
  $('daily').disabled = true;
  const { data, error } = await sb.rpc('claim_daily');
  if (error) { toast(error.message); return loadProfile(); }
  setBalance(data.balance);
  nextDaily = new Date(data.next).getTime();
  updateDaily();
  toast(`+${DAILY_AMOUNT} coins`);
};

$('refill').onclick = async () => {
  const { data, error } = await sb.rpc('claim_refill');
  if (error) return toast(error.message);
  setBalance(data.balance); toast('Refilled to 1,000');
};

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['coin', 'crash', 'ride', 'board'].forEach(t => $('tab-' + t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === 'board') loadBoard();
  if (b.dataset.tab === 'ride') drawRide();
  if (b.dataset.tab === 'crash' && !round && !ghost) drawGraph(1);
});

/* ---------- bet chips ---------- */
document.querySelectorAll('.chips').forEach(c => c.onclick = e => {
  const op = e.target.dataset.op; if (!op) return;
  const inp = $(c.dataset.for); let v = parseFloat(inp.value) || 0;
  if (op === 'half') v = v / 2;
  if (op === 'double') v = v * 2;
  if (op === 'max') v = balance;
  inp.value = (Math.floor(Math.min(v, balance) * 100) / 100).toFixed(2);
});

/* ---------- coin flip ---------- */
let pick = 'heads', coinRot = 0, flipping = false;
$('pick').onclick = e => {
  const p = e.target.dataset.pick; if (!p) return;
  pick = p;
  $('pick').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.pick === p));
};
$('flipBtn').onclick = async () => {
  if (flipping) return;
  const bet = readBet('coinBet'); if (!bet) return;
  flipping = true; $('flipBtn').disabled = true;
  $('coinResult').textContent = ''; $('coinResult').className = 'result';
  const { data, error } = await sb.rpc('flip_coin', { p_bet: bet, p_pick: pick });
  if (error) { toast(error.message); flipping = false; $('flipBtn').disabled = false; return; }
  const target = data.result === 'heads' ? 0 : 180;
  coinRot += 1800 + ((target - (coinRot % 360)) + 360) % 360;
  $('coin').style.transform = `rotateY(${coinRot}deg)`;
  setTimeout(() => {
    setBalance(data.balance);
    const r = $('coinResult');
    r.textContent = data.won ? `${data.result}! +${fmt(bet)}` : `${data.result}. −${fmt(bet)}`;
    r.className = 'result ' + (data.won ? 'win' : 'lose');
    flipping = false; $('flipBtn').disabled = false;
  }, 1550);
};

/* ---------- crash ---------- */
let round = null, raf = null, poll = null;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function niceStep(range){
  const raw = range / 4, p = 10 ** Math.floor(Math.log10(raw)), n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}

function drawGraph(m, state, mark){ // state: undefined | 'lost' | 'won' | 'ghost'; mark: cash-out multiplier
  const c = $('graph'), ctx = c.getContext('2d');
  const w = c.clientWidth, h = c.clientHeight, d = window.devicePixelRatio || 1;
  if (!w) return;
  if (c.width !== w * d || c.height !== h * d) { c.width = w * d; c.height = h * d; }
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);

  const t = Math.log(m) / K;
  const maxT = Math.max(8, t * 1.15), maxM = Math.max(2, m * 1.15);
  const pad = { l: 48, r: 16, t: 120, b: 26 };
  const X = s => pad.l + (s / maxT) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - ((v - 1) / (maxM - 1)) * (h - pad.t - pad.b);

  // grid
  ctx.font = '11px "IBM Plex Mono"'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = css('--grid'); ctx.fillStyle = css('--gridtext'); ctx.lineWidth = 1;
  const step = niceStep(maxM - 1);
  for (let v = 1; v <= maxM + 1e-9; v += step) {
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(step < 1 ? 1 : 0) + '×', 6, y);
  }
  ctx.textBaseline = 'top';
  const ts = niceStep(maxT);
  for (let s = 0; s <= maxT; s += ts) ctx.fillText(Math.round(s) + 's', X(s) - 6, h - pad.b + 8);

  if (m <= 1) return;
  const color = state === 'lost' ? css('--lose') : state === 'won' ? css('--win') : state === 'ghost' ? css('--muted') : css('--ink');

  const path = () => {
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const s = t * i / 80, x = X(s), y = Y(Math.exp(K * s));
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
  };
  // fill
  path(); ctx.lineTo(X(t), Y(1)); ctx.lineTo(X(0), Y(1)); ctx.closePath();
  ctx.fillStyle = state === 'ghost' ? 'rgba(141,138,148,.08)' : state === 'lost' ? 'rgba(255,77,69,.12)' : state === 'won' ? 'rgba(47,191,107,.12)' : 'rgba(255,90,60,.12)';
  ctx.fill();
  // line
  path(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  // tip
  ctx.beginPath(); ctx.arc(X(t), Y(m), 6, 0, Math.PI * 2);
  ctx.fillStyle = state ? color : css('--accent'); ctx.fill();
  // cash-out marker
  if (mark && mark > 1) {
    const mx = X(Math.log(mark) / K), my = Y(mark);
    ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2);
    ctx.fillStyle = css('--win'); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css('--card'); ctx.stroke();
    ctx.font = '600 12px "IBM Plex Mono"'; ctx.fillStyle = css('--win'); ctx.textBaseline = 'bottom';
    ctx.fillText(mark.toFixed(2) + '×', Math.min(mx + 10, w - 60), my - 6);
  }
}

function setCrashBtn(live){
  const b = $('crashBtn');
  b.classList.toggle('cash', live);
  b.textContent = live ? 'Cash out' : 'Launch';
  b.disabled = false;
}

$('crashBtn').onclick = () => round ? cashOut() : startCrash();

async function startCrash(){
  const bet = readBet('crashBet'); if (!bet) return;
  stopGhost();
  $('crashBtn').disabled = true;
  $('crashMsg').textContent = ''; $('crashMsg').className = 'sub';
  $('mult').className = 'mult';
  const { data, error } = await sb.rpc('crash_start', { p_bet: bet });
  if (error) { toast(error.message); $('crashBtn').disabled = false; return; }
  setBalance(data.balance);
  round = { id: data.round_id, bet, t0: performance.now(), done: false, cashing: false };
  setCrashBtn(true);
  raf = requestAnimationFrame(tick);
  poll = setInterval(checkCrash, 250);
}

function tick(){
  if (!round || round.done) return;
  const m = Math.exp(K * (performance.now() - round.t0) / 1000);
  drawGraph(m);
  $('mult').textContent = m.toFixed(2) + '×';
  $('crashBtn').textContent = 'Cash out ' + fmt(round.bet * m);
  const auto = parseFloat($('autoCash').value);
  if (auto > 1 && m >= auto) cashOut();
  raf = requestAnimationFrame(tick);
}

async function checkCrash(){
  if (!round || round.done || round.cashing) return;
  const id = round.id;
  const { data } = await sb.rpc('crash_status', { p_round: id });
  if (data?.crashed && round && round.id === id && !round.done) endRound(false, data.crash_point);
}

async function cashOut(){
  if (!round || round.done || round.cashing) return;
  round.cashing = true; $('crashBtn').disabled = true;
  const id = round.id;
  const { data, error } = await sb.rpc('crash_cashout', { p_round: id });
  if (!round || round.id !== id || round.done) return;
  if (error) { // probably already crashed; let status check finish it
    round.cashing = false; checkCrash(); return;
  }
  setBalance(data.balance);
  data.won ? endRound(true, data.multiplier, data.payout, data.crash_point) : endRound(false, data.crash_point);
}

function endRound(won, m, payout, crashAt){
  round.done = true;
  cancelAnimationFrame(raf); clearInterval(poll);
  m = Number(m);
  if (won && $('ghostToggle').checked) { startGhost(round, m, payout, crashAt); round = null; setCrashBtn(false); return; }
  drawGraph(m, won ? 'won' : 'lost');
  $('mult').textContent = m.toFixed(2) + '×';
  $('mult').className = 'mult ' + (won ? 'win' : 'lose');
  $('crashMsg').textContent = won ? `Cashed out +${fmt(payout)}` : `Crashed. −${fmt(round.bet)}`;
  $('crashMsg').className = 'sub ' + (won ? 'win' : 'lose');
  round = null;
  setCrashBtn(false);
}


/* ---------- ghost run: keep the rocket going after you cash out ---------- */
let ghost = null, ghostRaf = null, ghostPoll = null;
function startGhost(rd, cashM, payout, crashAt){
  ghost = { id: rd.id, t0: rd.t0, cashM, payout };
  if (crashAt) { // fast-forward: replay from cash out to crash in at most ~3s
    const tCash = Math.log(cashM) / K, tCrash = Math.log(Number(crashAt)) / K;
    ghost.ff = { tCash, tCrash, start: performance.now(), dur: Math.min(3000, Math.max(800, (tCrash - tCash) * 250)), cp: Number(crashAt) };
  }
  $('mult').className = 'mult';
  $('crashMsg').textContent = `Cashed out +${fmt(payout)} at ${cashM.toFixed(2)}×`;
  $('crashMsg').className = 'sub win';
  ghostRaf = requestAnimationFrame(ghostTick);
  if (!ghost.ff) ghostPoll = setInterval(ghostCheck, 250);
}
function ghostTick(){
  if (!ghost) return;
  let m;
  if (ghost.ff) {
    const f = ghost.ff, p = Math.min(1, (performance.now() - f.start) / f.dur);
    m = Math.exp(K * (f.tCash + (f.tCrash - f.tCash) * p));
    if (p >= 1) return ghostEnd(ghost, f.cp);
  } else {
    m = Math.exp(K * (performance.now() - ghost.t0) / 1000);
  }
  drawGraph(m, 'ghost', ghost.cashM);
  $('mult').textContent = m.toFixed(2) + '×';
  $('mult').style.color = css('--muted');
  ghostRaf = requestAnimationFrame(ghostTick);
}
async function ghostCheck(){
  if (!ghost) return;
  const g = ghost;
  const { data } = await sb.rpc('crash_status', { p_round: g.id });
  if (ghost !== g || !data?.crashed) return;
  ghostEnd(g, Number(data.crash_point));
}
function ghostEnd(g, cp){
  stopGhost();
  drawGraph(cp, 'lost', g.cashM);
  $('mult').style.color = '';
  $('mult').textContent = cp.toFixed(2) + '×';
  $('mult').className = 'mult lose';
  $('crashMsg').textContent = `Cashed ${g.cashM.toFixed(2)}× · crashed at ${cp.toFixed(2)}×`;
  $('crashMsg').className = 'sub win';
}
function stopGhost(){
  ghost = null;
  cancelAnimationFrame(ghostRaf); clearInterval(ghostPoll);
  $('mult').style.color = '';
}
try { const v = localStorage.getItem('jmb-ghost'); if (v !== null) $('ghostToggle').checked = v === '1'; } catch {}
$('ghostToggle').onchange = e => {
  try { localStorage.setItem('jmb-ghost', e.target.checked ? '1' : '0'); } catch {}
  if (!e.target.checked && ghost) { const g = ghost; stopGhost(); drawGraph(g.cashM, 'won'); $('mult').textContent = g.cashM.toFixed(2) + '×'; $('mult').className = 'mult win'; }
};

window.addEventListener('resize', () => { if (!round && !ghost) drawGraph(1); });


/* ---------- ride: hold to ride the chart ---------- */
// The chart comes from a server seed, so it's drawn locally with zero lag.
// MUST match _ride_path() in ride.sql.
const STEP_MS = 100, WINDOW = 120; // 12s visible
function ridePath(seed){
  let s = Number(seed), v = 0, p = 100;
  const arr = [100];
  arr.ext = n => {
    while (arr.length <= n) {
      s = (s * 48271) % 2147483647;
      v = 0.88 * v + (s / 2147483647 - 0.5) * 0.009 - 0.002 * Math.log(p / 100);
      s = (s * 48271) % 2147483647;
      p = p * Math.exp(v + (s / 2147483647 - 0.5) * 0.016);
      arr.push(p);
    }
  };
  return arr;
}

let ride = null, rideRaf = null, lastRide = null, C = {};
const loadColors = () => { C = { win: css('--win'), lose: css('--lose'), mut: css('--muted'), grid: css('--grid'), ink: css('--ink'), acc: css('--accent'), gt: css('--gridtext') }; };

$('rideStart').onclick = async () => {
  const bet = readBet('rideBet'); if (!bet) return;
  $('rideStart').disabled = true;
  const { data, error } = await sb.rpc('ride_start', { p_bet: bet });
  $('rideStart').disabled = false;
  if (error) return toast(error.message);
  setBalance(data.balance);
  loadColors();
  ride = { id: data.round_id, bet, path: ridePath(data.seed), t0: performance.now(), cur: 0,
           spans: [], holding: false, done: false, q: Promise.resolve(), lo: 95, hi: 105 };
  lastRide = ride;
  $('rideStart').hidden = true; $('holdBtn').hidden = false; $('rideCash').hidden = false;
  $('rideMsg').textContent = 'Hold to ride'; $('rideMsg').className = 'sub';
  $('rideVal').className = 'mult';
  rideRaf = requestAnimationFrame(rideLoop);
};

function priceAt(r, x){
  r.path.ext(Math.ceil(x) + 1);
  const i = Math.floor(x), f = x - i;
  return r.path[i] + (r.path[i + 1] - r.path[i]) * f;
}

// value multiplier: closed spans at whole steps (like the server), open span live
function rideMult(r){
  let m = 1;
  for (const sp of r.spans) {
    const end = sp.b == null ? r.cur : sp.b;
    m *= priceAt(r, end) / r.path[sp.a];
  }
  return Math.min(m, 25);
}

function setHold(on){
  const r = ride; if (!r || r.done || r.holding === on) return;
  const step = Math.floor(r.cur);
  r.holding = on;
  if (on) r.spans.push({ a: step, b: null });
  else r.spans[r.spans.length - 1].b = Math.max(step, r.spans[r.spans.length - 1].a);
  $('holdBtn').classList.toggle('on', on);
  $('holdBtn').textContent = on ? 'RIDING' : 'HOLD';
  r.q = r.q.then(() => sb.rpc('ride_hold', { p_round: r.id, p_on: on, p_step: step })).catch(() => {});
}

$('rideCash').onclick = () => {
  const r = ride; if (!r || r.done || r.stopping) return;
  if (r.holding) setHold(false);
  r.stopping = true; $('rideCash').disabled = true;
  const step = Math.floor(r.cur);
  r.q = r.q.then(() => sb.rpc('ride_stop', { p_round: r.id, p_step: step })).then(({ data, error }) => {
    $('rideCash').disabled = false;
    if (error) { r.stopping = false; return toast(error.message); }
    finishRide(data);
  });
};

function finishRide(d){
  const r = ride; r.done = true;
  cancelAnimationFrame(rideRaf);
  setBalance(d.balance);
  const pay = Number(d.payout), diff = pay - r.bet;
  $('rideVal').textContent = fmt(pay);
  $('rideVal').className = 'mult ' + (diff >= 0 ? 'win' : 'lose');
  $('rideMsg').textContent = diff >= 0 ? `+${fmt(diff)}` : `−${fmt(-diff)}`;
  $('rideMsg').className = 'sub ' + (diff >= 0 ? 'win' : 'lose');
  $('holdBtn').classList.remove('on'); $('holdBtn').textContent = 'HOLD';
  $('rideStart').hidden = false; $('holdBtn').hidden = true; $('rideCash').hidden = true;
  ride = null;
  drawRide();
}

function rideLoop(){
  const r = ride; if (!r) return;
  r.cur = (performance.now() - r.t0) / STEP_MS;
  const val = r.bet * rideMult(r);
  $('rideVal').textContent = fmt(val);
  $('rideVal').className = 'mult ' + (val > r.bet + 0.004 ? 'win' : val < r.bet - 0.004 ? 'lose' : '');
  $('rideMsg').textContent = r.holding ? 'Riding' : (r.spans.length ? 'Locked' : 'Hold to ride');
  drawRide();
  rideRaf = requestAnimationFrame(rideLoop);
}

function drawRide(){
  const c = $('rideGraph'), ctx = c.getContext('2d');
  const w = c.clientWidth, h = c.clientHeight, d = window.devicePixelRatio || 1;
  if (!w) return;
  if (!C.win) loadColors();
  if (c.width !== w * d || c.height !== h * d) { c.width = w * d; c.height = h * d; }
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);
  const r = ride || lastRide; if (!r) return;

  const pad = { l: 16, r: 16, t: 120, b: 20 };
  const end = r.cur, start = Math.max(0, end - WINDOW);
  const right = w - pad.r - (w - pad.l - pad.r) * 0.12;          // head stops a bit in from the edge
  const offset = Math.max(0, end - WINDOW);                       // grow from the left, then scroll
  const X = i => pad.l + (i - offset) / WINDOW * (right - pad.l);

  // y-range from visible points, eased so it doesn't jitter
  let lo = Infinity, hi = -Infinity;
  for (let i = Math.floor(start); i <= Math.floor(end); i++) { const p = r.path[i]; if (p < lo) lo = p; if (p > hi) hi = p; }
  const pe = priceAt(r, end); lo = Math.min(lo, pe); hi = Math.max(hi, pe);
  const mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2 * 1.25, mid * 0.03);
  const k = ride ? 0.08 : 1;
  r.lo += (mid - half - r.lo) * k; r.hi += (mid + half - r.hi) * k;
  const Y = v => h - pad.b - ((v - r.lo) / (r.hi - r.lo)) * (h - pad.t - pad.b);

  // entry line while riding
  if (r.holding) {
    const ep = r.path[r.spans[r.spans.length - 1].a];
    ctx.strokeStyle = C.grid; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(ep)); ctx.lineTo(w - pad.r, Y(ep)); ctx.stroke(); ctx.setLineDash([]);
  }

  const heldAt = i => r.spans.some(sp => i >= sp.a && i < (sp.b == null ? Infinity : sp.b));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = Math.floor(start); i < end; i++) {
    const x2 = Math.min(i + 1, end);
    const p1 = i < start ? priceAt(r, start) : r.path[i], p2 = priceAt(r, x2);
    const held = heldAt(i);
    ctx.strokeStyle = held ? (p2 >= p1 ? C.win : C.lose) : C.mut;
    ctx.lineWidth = held ? 4 : 2;
    ctx.beginPath(); ctx.moveTo(X(Math.max(i, start)), Y(p1)); ctx.lineTo(X(x2), Y(p2)); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(X(end), Y(pe), 7, 0, Math.PI * 2);
  ctx.fillStyle = r.holding ? (pe >= r.path[r.spans[r.spans.length - 1].a] ? C.win : C.lose) : C.acc; ctx.fill();

  // time
  ctx.font = '11px "IBM Plex Mono"'; ctx.fillStyle = C.gt; ctx.textBaseline = 'top';
  ctx.fillText((end / 10).toFixed(1) + 's', 8, 8);
}

// hold: press anywhere on the HOLD button or the chart (touch, mouse) or the space bar
function bindHold(el){
  const down = e => { if (!ride) return; e.preventDefault(); setHold(true); };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('mousedown', down);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindHold($('holdBtn')); bindHold($('rideBox'));
['touchend', 'touchcancel', 'mouseup'].forEach(ev => window.addEventListener(ev, () => setHold(false)));
document.addEventListener('keydown', e => { if (e.code === 'Space' && ride && !$('tab-ride').hidden) { e.preventDefault(); if (!e.repeat) setHold(true); } });
document.addEventListener('keyup', e => { if (e.code === 'Space' && ride) { e.preventDefault(); setHold(false); } });
window.addEventListener('blur', () => setHold(false));
window.addEventListener('resize', drawRide);

/* ---------- leaderboard ---------- */
async function loadBoard(){
  const { data, error } = await sb.from('profiles').select('id,username,balance').order('balance', { ascending: false }).limit(10);
  if (error) return toast(error.message);
  $('board').innerHTML = '';
  data.forEach((p, i) => {
    const tr = document.createElement('tr');
    if (p.id === user.id) tr.className = 'me';
    tr.innerHTML = `<td>${i + 1}</td><td></td><td>${fmt(p.balance)}</td>`;
    tr.children[1].textContent = p.username; // safe from HTML injection
    $('board').appendChild(tr);
  });
}

renderAuth();
</script>
